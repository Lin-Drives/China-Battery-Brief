<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover 055 — The Ten-Percent Lane: How China's Hybrids Slipped Past Europe's Tariff Wall">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ADFC3" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#5ADFC3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0C1017"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- ghost issue number -->
  <text x="796" y="196" text-anchor="end" font-family="Georgia,serif" font-size="168" fill="#5ADFC3" opacity="0.06">055</text>

  <!-- corner ticks -->
  <g stroke="#5ADFC3" stroke-width="2" opacity="0.9">
    <path d="M18 44 V26 a8 8 0 0 1 8 -8 H44" fill="none"/>
    <path d="M782 44 V26 a8 8 0 0 0 -8 -8 H756" fill="none"/>
    <path d="M18 556 V574 a8 8 0 0 0 8 8 H44" fill="none"/>
    <path d="M782 556 V574 a8 8 0 0 1 -8 8 H756" fill="none"/>
  </g>

  <!-- masthead -->
  <text x="48" y="52" font-family="Courier,monospace" font-size="13" letter-spacing="4" fill="#8E97A8">CHINA BATTERY BRIEF</text>
  <text x="752" y="52" text-anchor="end" font-family="Courier,monospace" font-size="13" letter-spacing="2" fill="#5ADFC3">No. 055 · THU 06:00 UTC</text>
  <line x1="48" y1="72" x2="752" y2="72" stroke="#1B2A33" stroke-width="1"/>

  <!-- title -->
  <text x="48" y="208" font-family="Georgia,serif" font-size="68" fill="#F4F0E6">The Ten-Percent</text>
  <text x="48" y="286" font-family="Georgia,serif" font-size="68" fill="#F4F0E6">Lane</text>
  <text x="48" y="356" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#C9F24B">BEVs pay 45%. Hybrids pay 10%. Everyone changed lanes</text>

  <!-- tariff lanes graphic -->
  <g font-family="Courier,monospace" font-size="13" letter-spacing="1.2">
    <!-- BEV lane: high wall -->
    <rect x="48" y="418" width="704" height="30" fill="#1B2A33" opacity="0.55"/>
    <rect x="48" y="418" width="704" height="30" fill="none" stroke="#B0432F" stroke-width="1" opacity="0.7"/>
    <text x="64" y="438" fill="#F4F0E6">BEV LANE</text>
    <text x="736" y="438" text-anchor="end" fill="#B0432F">TARIFF UP TO 45% · WALLED</text>
    <!-- hybrid lane: open, flowing -->
    <rect x="48" y="462" width="704" height="30" fill="#5ADFC3" opacity="0.10"/>
    <rect x="48" y="462" width="704" height="30" fill="none" stroke="#5ADFC3" stroke-width="1"/>
    <text x="64" y="482" fill="#F4F0E6">HYBRID LANE</text>
    <text x="736" y="482" text-anchor="end" fill="#5ADFC3">10% ONLY · 3,800 → 50,000 /MO</text>
  </g>

  <!-- accent block -->
  <rect x="48" y="516" width="26" height="14" fill="#5ADFC3"/>
  <rect x="84" y="516" width="3" height="14" fill="#5ADFC3" opacity="0.35"/>
  <text x="128" y="527" font-family="Courier,monospace" font-size="13" letter-spacing="1.2" fill="#8E97A8">EU ASK: VOLUNTARY EXPORT LIMIT · CHINA: VIOLATES WTO</text>

  <line x1="48" y1="548" x2="752" y2="548" stroke="#1B2A33" stroke-width="1"/>
  <text x="48" y="566" font-family="Courier,monospace" font-size="11" letter-spacing="2" fill="#8E97A8">CBB · WEEKLY INTELLIGENCE · EVERY THURSDAY 06:00 UTC</text>
</svg>
