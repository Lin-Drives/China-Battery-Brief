<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="图表：2026 年 1—9 月储能电芯出货 779.9GWh，中国以外 466.8GWh、占 59.9%，电网侧 575.9GWh、占 73.8%">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5C6675" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0C1017"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <text x="72" y="64" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="14" letter-spacing="3" fill="#8E97A8">2026 年 1—9 月，储能电芯出货</text>
  <text x="72" y="112" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="32" font-weight="600" fill="#F4F0E6">海外已占六成需求，电网侧仍是七成四</text>
  <line x1="72" y1="136" x2="1128" y2="136" stroke="#1B2A33" stroke-width="1"/>

  <text x="72" y="196" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" letter-spacing="2" fill="#8E97A8">按需求所在地</text>
  <text x="1128" y="196" text-anchor="end" font-family="Courier,monospace" font-size="18" fill="#F4F0E6">779.9 GWh</text>

  <rect x="72" y="216" width="345" height="56" fill="#5ADFC3" opacity="0.32"/>
  <rect x="417" y="216" width="515" height="56" fill="#C9F24B" opacity="0.42"/>
  <rect x="72" y="216" width="860" height="56" fill="none" stroke="#2A3A44" stroke-width="1.2"/>
  <line x1="417" y1="216" x2="417" y2="272" stroke="#0C1017" stroke-width="2"/>

  <text x="90" y="250" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="15" fill="#F4F0E6">中国 313.1GWh</text>
  <text x="90" y="264" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="12" fill="#8E97A8">40.1%</text>
  <text x="436" y="250" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="15" fill="#F4F0E6">中国以外 466.8GWh</text>
  <text x="436" y="264" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="12" fill="#8E97A8">59.9%</text>

  <text x="72" y="352" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" letter-spacing="2" fill="#8E97A8">按应用场景</text>
  <text x="1128" y="352" text-anchor="end" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#5C6675">三类合计 735.6GWh，占 94.3%</text>

  <rect x="72" y="372" width="635" height="56" fill="#2F6E77" opacity="0.75"/>
  <rect x="707" y="372" width="108" height="56" fill="#C9F24B" opacity="0.55"/>
  <rect x="815" y="372" width="69" height="56" fill="#F0A832" opacity="0.55"/>
  <rect x="884" y="372" width="48" height="56" fill="url(#hatch)"/>
  <rect x="72" y="372" width="860" height="56" fill="none" stroke="#2A3A44" stroke-width="1.2"/>

  <text x="90" y="398" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="15" fill="#F4F0E6">电网侧 575.9GWh</text>
  <text x="90" y="414" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="12" fill="#C9E9E3">73.8%</text>

  <rect x="72" y="458" width="12" height="12" fill="#C9F24B" opacity="0.55"/>
  <text x="94" y="469" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#8E97A8">用户侧 97.5GWh · 12.5%</text>
  <rect x="470" y="458" width="12" height="12" fill="#F0A832" opacity="0.55"/>
  <text x="492" y="469" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#8E97A8">工商业 62.2GWh · 8.0%</text>

  <line x1="72" y1="560" x2="1128" y2="560" stroke="#1B2A33" stroke-width="1"/>
  <text x="72" y="596" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#5C6675">用户侧同比增长 152%，是增速最快的一类</text>
  <text x="1128" y="596" text-anchor="end" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#5C6675">数据来源：SNE Research，经中国储能网</text>
  <text x="72" y="624" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#5C6675">口径为出货量而非装机量；区域按需求所在地划分</text>
</svg>
