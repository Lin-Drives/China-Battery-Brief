<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="欧盟自中国进口混动汽车：2024 年 10.7 万辆，2025 年 30.2 万辆，磋商天花板设在 2025 年水平之上">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0C1017"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- header -->
  <text x="72" y="64" font-family="Courier,monospace" font-size="14" letter-spacing="3" fill="#8E97A8">欧盟自中国进口混动汽车 · 辆/年</text>
  <line x1="72" y1="86" x2="1128" y2="86" stroke="#1B2A33" stroke-width="1"/>

  <!-- negotiated ceiling -->
  <text x="1010" y="106" text-anchor="end" font-family="Courier,monospace" font-size="15" fill="#F0A832">磋商天花板</text>
  <text x="1010" y="128" text-anchor="end" font-family="Courier,monospace" font-size="12.5" fill="#F0A832" opacity="0.8">“在 2025 年基础上向上安排”，官方未公布数量</text>
  <line x1="500" y1="142" x2="1010" y2="142" stroke="#F0A832" stroke-width="2.5" stroke-dasharray="10 7"/>

  <!-- up arrow -->
  <path d="M830 176 V150" stroke="#F0A832" stroke-width="2.5" fill="none"/>
  <path d="M822 162 L830 148 L838 162 Z" fill="#F0A832"/>

  <!-- axis -->
  <line x1="120" y1="560" x2="1128" y2="560" stroke="#8E97A8" stroke-width="1" opacity="0.5"/>

  <!-- 2024 bar: 10.7万 -> 135px -->
  <rect x="240" y="425" width="180" height="135" fill="#5ADFC3" opacity="0.85"/>
  <text x="330" y="478" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#0C1017">10.7 万</text>
  <text x="330" y="596" text-anchor="middle" font-family="Courier,monospace" font-size="16" letter-spacing="2" fill="#8E97A8">2024</text>

  <!-- 2025 bar: 30.2万 -> 380px -->
  <rect x="560" y="180" width="180" height="380" fill="#C9F24B"/>
  <text x="650" y="233" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#0C1017">30.2 万</text>
  <text x="650" y="596" text-anchor="middle" font-family="Courier,monospace" font-size="16" letter-spacing="2" fill="#8E97A8">2025</text>

  <!-- annotations -->
  <text x="780" y="320" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#F4F0E6">谢夫乔维奇 X 帖：出口“减半”——</text>
  <text x="780" y="350" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#F4F0E6">相对的是 2026 年 7 月单月</text>
  <text x="780" y="380" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#F4F0E6">5 万辆所隐含的轨迹</text>
  <text x="780" y="440" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#C9F24B">商务部口径：“确保出口空间”——</text>
  <text x="780" y="470" font-family="Georgia,serif" font-style="italic" font-size="20" fill="#C9F24B">相对的是 2025 年基准</text>

  <!-- footer -->
  <line x1="72" y1="628" x2="1128" y2="628" stroke="#1B2A33" stroke-width="1"/>
  <text x="72" y="654" font-family="Courier,monospace" font-size="12.5" letter-spacing="1.5" fill="#8E97A8">数据来源：欧盟统计局，中国商务部 2026-10-12 援引 · 天花板位置为示意</text>
  <text x="1128" y="654" text-anchor="end" font-family="Courier,monospace" font-size="12.5" letter-spacing="2" fill="#C9F24B">CBB · No.058</text>
</svg>
