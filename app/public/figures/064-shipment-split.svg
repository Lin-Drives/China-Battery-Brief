<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: of 779.9GWh of storage cells shipped in January-September 2026, 466.8GWh or 59.9% went outside China, and 575.9GWh or 73.8% went to grid-side projects">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5C6675" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0C1017"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <text x="72" y="64" font-family="Courier,monospace" font-size="14" letter-spacing="3" fill="#8E97A8">JANUARY—SEPTEMBER 2026, STORAGE CELL SHIPMENTS</text>
  <text x="72" y="112" font-family="Georgia,serif" font-size="34" fill="#F4F0E6">Overseas is 60% of demand; the grid side is still 74%</text>
  <line x1="72" y1="136" x2="1128" y2="136" stroke="#1B2A33" stroke-width="1"/>

  <text x="72" y="196" font-family="Courier,monospace" font-size="13" letter-spacing="2.5" fill="#8E97A8">BY REGION OF DEMAND</text>
  <text x="1128" y="196" text-anchor="end" font-family="Courier,monospace" font-size="18" fill="#F4F0E6">779.9 GWh</text>

  <rect x="72" y="216" width="345" height="56" fill="#5ADFC3" opacity="0.32"/>
  <rect x="417" y="216" width="515" height="56" fill="#C9F24B" opacity="0.42"/>
  <rect x="72" y="216" width="860" height="56" fill="none" stroke="#2A3A44" stroke-width="1.2"/>
  <line x1="417" y1="216" x2="417" y2="272" stroke="#0C1017" stroke-width="2"/>

  <text x="90" y="250" font-family="Courier,monospace" font-size="16" fill="#F4F0E6">CHINA 313.1</text>
  <text x="90" y="264" font-family="Courier,monospace" font-size="12" fill="#8E97A8">40.1%</text>
  <text x="436" y="250" font-family="Courier,monospace" font-size="16" fill="#F4F0E6">OUTSIDE CHINA 466.8</text>
  <text x="436" y="264" font-family="Courier,monospace" font-size="12" fill="#8E97A8">59.9%</text>

  <text x="72" y="352" font-family="Courier,monospace" font-size="13" letter-spacing="2.5" fill="#8E97A8">BY APPLICATION</text>
  <text x="1128" y="352" text-anchor="end" font-family="Courier,monospace" font-size="13" fill="#5C6675">THREE SEGMENTS = 735.6GWh, 94.3%</text>

  <rect x="72" y="372" width="635" height="56" fill="#2F6E77" opacity="0.75"/>
  <rect x="707" y="372" width="108" height="56" fill="#C9F24B" opacity="0.55"/>
  <rect x="815" y="372" width="69" height="56" fill="#F0A832" opacity="0.55"/>
  <rect x="884" y="372" width="48" height="56" fill="url(#hatch)"/>
  <rect x="72" y="372" width="860" height="56" fill="none" stroke="#2A3A44" stroke-width="1.2"/>

  <text x="90" y="398" font-family="Courier,monospace" font-size="16" fill="#F4F0E6">GRID-SIDE 575.9</text>
  <text x="90" y="414" font-family="Courier,monospace" font-size="12" fill="#C9E9E3">73.8%</text>

  <rect x="72" y="458" width="12" height="12" fill="#C9F24B" opacity="0.55"/>
  <text x="94" y="469" font-family="Courier,monospace" font-size="13" fill="#8E97A8">USER-SIDE 97.5GWH · 12.5%</text>
  <rect x="470" y="458" width="12" height="12" fill="#F0A832" opacity="0.55"/>
  <text x="492" y="469" font-family="Courier,monospace" font-size="13" fill="#8E97A8">C&amp;I 62.2GWH · 8.0%</text>

  <line x1="72" y1="560" x2="1128" y2="560" stroke="#1B2A33" stroke-width="1"/>
  <text x="72" y="596" font-family="Courier,monospace" font-size="13" fill="#5C6675">USER-SIDE GREW 152% YEAR ON YEAR, THE FASTEST SEGMENT</text>
  <text x="1128" y="596" text-anchor="end" font-family="Courier,monospace" font-size="13" fill="#5C6675">SOURCE: SNE RESEARCH, VIA CHINA ENERGY STORAGE NETWORK</text>
  <text x="72" y="624" font-family="Courier,monospace" font-size="13" fill="#5C6675">SHIPMENTS, NOT INSTALLATIONS; REGIONAL SPLIT BY MARKET OF DEMAND</text>
</svg>
