<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2026 年中国企业海外储能订单季度分布，三季度被亿纬与 Fluence 单笔 206GWh 协议显著抬高">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F0A832" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0C1017"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <text x="72" y="64" font-family="Courier,monospace" font-size="14" letter-spacing="3" fill="#8E97A8">中国企业披露的海外储能订单</text>
  <text x="72" y="108" font-family="Georgia,serif" font-size="36" fill="#F4F0E6">一笔合同弯折了曲线</text>
  <line x1="72" y1="132" x2="1128" y2="132" stroke="#1B2A33" stroke-width="1"/>

  <text x="72" y="172" font-family="Courier,monospace" font-size="12" letter-spacing="2" fill="#C9F24B">GWh</text>

  <g stroke="#1B2A33" stroke-width="1">
    <line x1="150" y1="180" x2="1080" y2="180"/>
    <line x1="150" y1="275" x2="1080" y2="275"/>
    <line x1="150" y1="370" x2="1080" y2="370"/>
    <line x1="150" y1="465" x2="1080" y2="465"/>
    <line x1="150" y1="560" x2="1080" y2="560"/>
  </g>
  <g font-family="Courier,monospace" font-size="13" fill="#5C6675" text-anchor="end">
    <text x="132" y="185">320</text>
    <text x="132" y="280">240</text>
    <text x="132" y="375">160</text>
    <text x="132" y="470">80</text>
    <text x="132" y="565">0</text>
  </g>

  <rect x="190" y="426" width="150" height="134" fill="#2F6E77"/>
  <rect x="190" y="426" width="150" height="4" fill="#5ADFC3"/>
  <text x="265" y="412" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#F4F0E6">112.7</text>
  <text x="265" y="596" text-anchor="middle" font-family="Courier,monospace" font-size="14" letter-spacing="2" fill="#8E97A8">一季度</text>

  <rect x="475" y="351" width="150" height="209" fill="#2F6E77"/>
  <rect x="475" y="351" width="150" height="4" fill="#5ADFC3"/>
  <text x="550" y="337" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#F4F0E6">176.0</text>
  <text x="550" y="596" text-anchor="middle" font-family="Courier,monospace" font-size="14" letter-spacing="2" fill="#8E97A8">二季度</text>

  <rect x="760" y="453" width="150" height="107" fill="#2F6E77"/>
  <rect x="760" y="453" width="150" height="4" fill="#5ADFC3"/>
  <text x="835" y="586" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#F4F0E6">89.9</text>
  <text x="835" y="606" text-anchor="middle" font-family="Courier,monospace" font-size="10" letter-spacing="1" fill="#8E97A8">剔除大单</text>

  <rect x="760" y="209" width="150" height="244" fill="url(#hatch)" stroke="#F0A832" stroke-width="1.2"/>
  <text x="835" y="196" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#F0A832">295.9</text>
  <text x="835" y="238" text-anchor="middle" font-family="Courier,monospace" font-size="12" letter-spacing="1" fill="#F0A832">206.0</text>
  <text x="835" y="258" text-anchor="middle" font-family="Courier,monospace" font-size="10" letter-spacing="1" fill="#F0A832">单笔协议</text>
  <text x="835" y="596" text-anchor="middle" font-family="Courier,monospace" font-size="14" letter-spacing="2" fill="#8E97A8">三季度</text>

  <line x1="915" y1="300" x2="1000" y2="300" stroke="#F0A832" stroke-width="1.5"/>
  <text x="1012" y="296" font-family="Georgia,serif" font-size="14" fill="#F0A832">亿纬–Fluence</text>
  <text x="1012" y="316" font-family="Georgia,serif" font-size="14" fill="#F0A832">206GWh，占 35.2%</text>
  <text x="1012" y="336" font-family="Courier,monospace" font-size="11" letter-spacing="1" fill="#8E97A8">前三季度披露总量</text>

  <text x="1012" y="490" font-family="Georgia,serif" font-size="15" fill="#8E97A8">三季度剔除大单</text>
  <text x="1012" y="514" font-family="Georgia,serif" font-size="26" fill="#5ADFC3">-49%</text>
  <text x="1012" y="534" font-family="Courier,monospace" font-size="11" letter-spacing="1" fill="#8E97A8">环比二季度</text>

  <line x1="72" y1="628" x2="1128" y2="628" stroke="#1B2A33" stroke-width="1"/>
  <text x="72" y="652" font-family="Courier,monospace" font-size="11" letter-spacing="1" fill="#5C6675">数据来源：CESA 储能应用分会产业数据库，2026 年 11 月</text>
</svg>
