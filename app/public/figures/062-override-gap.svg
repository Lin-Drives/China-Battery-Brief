<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart: Democrats won 224 of 435 House seats and 53 of 100 Senate seats; overriding a veto needs 290 and 67, leaving gaps of 66 and 14 seats">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0C1017"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <text x="72" y="64" font-family="Courier,monospace" font-size="14" letter-spacing="3" fill="#8E97A8">THE 2026 MIDTERMS, IN SEATS</text>
  <text x="72" y="110" font-family="Georgia,serif" font-size="36" fill="#F4F0E6">One chamber could still clear 290. The Senate cannot reach 67.</text>
  <line x1="72" y1="134" x2="1128" y2="134" stroke="#1B2A33" stroke-width="1"/>

  <!-- HOUSE -->
  <text x="72" y="210" font-family="Courier,monospace" font-size="13" letter-spacing="2.5" fill="#8E97A8">HOUSE</text>
  <text x="72" y="234" font-family="Georgia,serif" font-size="14" fill="#5C6675">435 seats</text>

  <rect x="200" y="184" width="860" height="44" fill="#0F141C" stroke="#1B2A33" stroke-width="1"/>
  <rect x="200" y="184" width="443" height="44" fill="#5A6B9E" opacity="0.55"/>
  <rect x="200" y="184" width="443" height="44" fill="none" stroke="#5A6B9E" stroke-width="1.4"/>

  <text x="212" y="212" font-family="Courier,monospace" font-size="13" letter-spacing="1.5" fill="#F4F0E6">224 WON</text>
  <text x="1064" y="212" text-anchor="end" font-family="Courier,monospace" font-size="12" letter-spacing="1.5" fill="#8E97A8">66 SHORT</text>

  <!-- SENATE -->
  <text x="72" y="330" font-family="Courier,monospace" font-size="13" letter-spacing="2.5" fill="#8E97A8">SENATE</text>
  <text x="72" y="354" font-family="Georgia,serif" font-size="14" fill="#5C6675">100 seats</text>

  <rect x="200" y="304" width="860" height="44" fill="#0F141C" stroke="#1B2A33" stroke-width="1"/>
  <rect x="200" y="304" width="456" height="44" fill="#2F6E77" opacity="0.6"/>
  <rect x="200" y="304" width="456" height="44" fill="none" stroke="#2F6E77" stroke-width="1.4"/>

  <text x="212" y="332" font-family="Courier,monospace" font-size="13" letter-spacing="1.5" fill="#F4F0E6">53 WON</text>
  <text x="1064" y="332" text-anchor="end" font-family="Courier,monospace" font-size="12" letter-spacing="1.5" fill="#8E97A8">14 SHORT</text>

  <!-- single two-thirds line through both bars -->
  <line x1="774" y1="168" x2="774" y2="364" stroke="#F0A832" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="774" y="158" text-anchor="middle" font-family="Courier,monospace" font-size="12" letter-spacing="2" fill="#F0A832">TWO-THIRDS LINE</text>
  <text x="774" y="392" text-anchor="middle" font-family="Courier,monospace" font-size="11" letter-spacing="1.5" fill="#8E97A8">290 HOUSE · 67 SENATE</text>

  <line x1="72" y1="424" x2="1128" y2="424" stroke="#1B2A33" stroke-width="1"/>

  <text x="72" y="462" font-family="Courier,monospace" font-size="12" letter-spacing="2.5" fill="#8E97A8">WHAT STILL MOVES WITHOUT A VOTE</text>
  <text x="72" y="502" font-family="Georgia,serif" font-size="18" fill="#F4F0E6">Section 301 tariffs · FEOC and 45X eligibility · FCC inverter ban · export controls · COINS rulemaking</text>
  <text x="72" y="528" font-family="Georgia,serif" font-size="14" fill="#8E97A8">Five instruments, five agencies, one president. None of them requires this Congress.</text>

  <rect x="72" y="552" width="1056" height="72" fill="#111823" stroke="#1B2A33" stroke-width="1"/>
  <rect x="72" y="552" width="5" height="72" fill="#C9F24B"/>
  <text x="98" y="582" font-family="Courier,monospace" font-size="12" letter-spacing="2" fill="#C9F24B">THE ONLY LEGISLATIVE PATH</text>
  <text x="98" y="608" font-family="Georgia,serif" font-size="16" fill="#F4F0E6">A new statute needs 218, 51 and a signature, or 290 and 67 without one.</text>
</svg>
