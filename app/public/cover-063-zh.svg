  <text x="48" y="468" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" letter-spacing="1.5" fill="#5C6675">2026 年 1—9 月，能量口径</text>
  <text x="48" y="500" font-family="Courier,monospace" font-size="13" letter-spacing="1" fill="#5ADFC3">销量 595.4GWh</text>
  <text x="300" y="500" font-family="Courier,monospace" font-size="13" letter-spacing="1" fill="#C9F24B">国内装机 84GWh</text>
  <text x="48" y="524" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#8E97A8">留在国内的比例 14%</text>

  <text x="48" y="560" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="12" fill="#5C6675">填不满的产线，结局是闲置或降价。</text>
