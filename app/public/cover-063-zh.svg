      <stop offset="0" stop-color="#C9F24B" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#C9F24B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0C1017"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <text x="796" y="196" text-anchor="end" font-family="Georgia,serif" font-size="168" fill="#C9F24B" opacity="0.06">063</text>

  <g stroke="#C9F24B" stroke-width="2" opacity="0.85">
    <path d="M18 44 V26 a8 8 0 0 1 8 -8 H44" fill="none"/>
    <path d="M782 44 V26 a8 8 0 0 0 -8 -8 H756" fill="none"/>
    <path d="M18 556 V574 a8 8 0 0 0 8 8 H44" fill="none"/>
    <path d="M782 556 V574 a8 8 0 0 1 -8 8 H756" fill="none"/>
  </g>

  <text x="48" y="52" font-family="Courier,monospace" font-size="13" letter-spacing="4" fill="#8E97A8">CHINA BATTERY BRIEF</text>
  <text x="752" y="52" text-anchor="end" font-family="Courier,monospace" font-size="13" letter-spacing="2" fill="#C9F24B">No. 063 · 周四 06:00 UTC</text>
  <line x1="48" y1="72" x2="752" y2="72" stroke="#1B2A33" stroke-width="1"/>

  <text x="48" y="140" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="15" letter-spacing="4" fill="#F0A832">政策 · 市场</text>

  <text x="48" y="268" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="80" font-weight="600" fill="#F4F0E6">出口填不满</text>
  <text x="48" y="358" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="80" font-weight="600" fill="#C9F24B">规划产能</text>

  <text x="48" y="406" font-family="PingFang SC, Noto Sans SC, sans-serif" font-size="22" fill="#8E97A8">规划产能近 2TWh，年化需求不到一半；分水岭是规格与成本</text>

