  <g font-family="Courier,monospace" font-size="14" letter-spacing="1.5">
    <text x="128" y="426" fill="#F4F0E6">SUPERNODE ST3 · QLD</text>
    <text x="420" y="426" fill="#8E97A8">—</text>
    <text x="448" y="426" fill="#F4F0E6">260 MW · 1,216 MWH</text>

    <text x="128" y="462" fill="#F4F0E6">NEM PRICE SPREAD</text>
    <text x="420" y="462" fill="#8E97A8">—</text>
    <text x="448" y="462" fill="#F0A832">−85% · AU$51/MWH</text>

