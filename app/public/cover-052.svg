    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ADFC3" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#5ADFC3" stop-opacity="0"/>
