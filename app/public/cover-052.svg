<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover 052 — The Market Is the Ceiling: Australia Lets the Cells In, Then Prices Them Out">
  <defs>
