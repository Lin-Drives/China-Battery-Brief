  <text x="796" y="196" text-anchor="end" font-family="Georgia,serif" font-size="168" fill="#5ADFC3" opacity="0.06">052</text>

  <!-- corner ticks -->
  <g stroke="#5ADFC3" stroke-width="2" opacity="0.9">
    <path d="M18 44 V26 a8 8 0 0 1 8 -8 H44" fill="none"/>
    <path d="M782 44 V26 a8 8 0 0 0 -8 -8 H756" fill="none"/>
    <path d="M18 556 V574 a8 8 0 0 0 8 8 H44" fill="none"/>
    <path d="M782 556 V574 a8 8 0 0 1 -8 8 H756" fill="none"/>
  </g>

  <!-- masthead -->
  <text x="48" y="52" font-family="Courier,monospace" font-size="13" letter-spacing="4" fill="#8E97A8">CHINA BATTERY BRIEF</text>
  <text x="752" y="52" text-anchor="end" font-family="Courier,monospace" font-size="13" letter-spacing="2" fill="#5ADFC3">No. 052 · THU 06:00 UTC</text>
  <line x1="48" y1="72" x2="752" y2="72" stroke="#1B2A33" stroke-width="1"/>

  <!-- title -->
  <text x="48" y="208" font-family="Georgia,serif" font-size="76" fill="#F4F0E6">The Market</text>
  <text x="48" y="292" font-family="Georgia,serif" font-size="76" fill="#F4F0E6">Is the Ceiling</text>
  <text x="48" y="340" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#F0A832">Down under, the cells get in — the price does not</text>

