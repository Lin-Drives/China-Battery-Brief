  <text x="752" y="52" text-anchor="end" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="1" fill="#C9F24B">第 056 期 · 周四 06:00 UTC</text>
