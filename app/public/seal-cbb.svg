<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
    <path id="ringPath" d="M 60,60 m -44,0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0"/>
  </defs>
  <g filter="url(#rough)" color="currentColor">
    <!-- outer ring -->
    <circle cx="60" cy="60" r="56" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="34" stroke="currentColor" stroke-width="1.5"/>
    <!-- ring text -->
    <text fill="currentColor" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="2.2">
      <textPath href="#ringPath" startOffset="0">CHINA BATTERY BRIEF · EST 2025 · CHINA BATTERY BRIEF ·</textPath>
    </text>
    <!-- center cell-grid square -->
    <rect x="42" y="42" width="36" height="36" stroke="currentColor" stroke-width="1.5"/>
    <line x1="60" y1="42" x2="60" y2="78" stroke="currentColor" stroke-width="1"/>
    <line x1="42" y1="60" x2="78" y2="60" stroke="currentColor" stroke-width="1"/>
    <!-- center character -->
    <text x="60" y="69" text-anchor="middle" fill="currentColor" font-family="'Noto Serif SC', serif" font-weight="500" font-size="30">电</text>
  </g>
</svg>
