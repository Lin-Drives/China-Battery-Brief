<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover 056 — From Scale to Spec: China's First National Battery Plan">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.1" fill="#1B2A33"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9F24B" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="#C9F24B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0C1017"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- ghost issue number -->
  <text x="796" y="196" text-anchor="end" font-family="Georgia,serif" font-size="168" fill="#C9F24B" opacity="0.06">056</text>

  <!-- corner ticks -->
  <g stroke="#C9F24B" stroke-width="2" opacity="0.85">
    <path d="M18 44 V26 a8 8 0 0 1 8 -8 H44" fill="none"/>
    <path d="M782 44 V26 a8 8 0 0 0 -8 -8 H756" fill="none"/>
    <path d="M18 556 V574 a8 8 0 0 0 8 8 H44" fill="none"/>
    <path d="M782 556 V574 a8 8 0 0 1 -8 8 H756" fill="none"/>
  </g>

  <!-- masthead -->
  <text x="48" y="52" font-family="Courier,monospace" font-size="13" letter-spacing="4" fill="#8E97A8">CHINA BATTERY BRIEF</text>
  <text x="752" y="52" text-anchor="end" font-family="Courier,monospace" font-size="13" letter-spacing="2" fill="#C9F24B">No. 056 · THU 06:00 UTC</text>
  <line x1="48" y1="72" x2="752" y2="72" stroke="#1B2A33" stroke-width="1"/>

  <!-- title -->
  <text x="48" y="182" font-family="Georgia,serif" font-size="68" fill="#F4F0E6">From Scale</text>
  <text x="48" y="260" font-family="Georgia,serif" font-size="68" fill="#F4F0E6">to Spec</text>
  <text x="48" y="316" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#C9F24B">The first national battery plan sets no output target</text>

  <!-- spec sheet -->
  <text x="48" y="356" font-family="Courier,monospace" font-size="12" letter-spacing="2.2" fill="#8E97A8">THE 2030 SPEC SHEET — AND THE ONE EMPTY CELL</text>

  <g font-family="Courier,monospace" font-size="15" letter-spacing="1.2">
    <text x="48" y="392" fill="#B0432F">OUTPUT TARGET</text>
    <text x="752" y="392" text-anchor="end" fill="#B0432F">—  NONE SET</text>
    <line x1="48" y1="407" x2="752" y2="407" stroke="#1B2A33" stroke-width="1"/>

    <text x="48" y="434" fill="#F4F0E6">ALL-SOLID-STATE</text>
    <text x="752" y="434" text-anchor="end" fill="#C9F24B">2030 · INITIAL SCALE</text>
    <line x1="48" y1="449" x2="752" y2="449" stroke="#1B2A33" stroke-width="1"/>

    <text x="48" y="476" fill="#F4F0E6">CYCLE LIFE</text>
    <text x="752" y="476" text-anchor="end" fill="#5ADFC3">15,000  (RECORD: 12,000)</text>
    <line x1="48" y1="491" x2="752" y2="491" stroke="#1B2A33" stroke-width="1"/>

    <text x="48" y="518" fill="#F4F0E6">DEFECT RATE</text>
    <text x="752" y="518" text-anchor="end" fill="#5ADFC3">PPB  ·  LEADING FIRMS</text>
  </g>

  <!-- accent block -->
  <rect x="48" y="540" width="26" height="14" fill="#C9F24B"/>
  <rect x="84" y="540" width="3" height="14" fill="#C9F24B" opacity="0.35"/>
  <text x="128" y="551" font-family="Courier,monospace" font-size="12" letter-spacing="1.2" fill="#8E97A8">7 MINISTRIES · 19 TASKS · 5 COLUMNS · GOING ABROAD IS A TASK</text>

  <line x1="48" y1="568" x2="752" y2="568" stroke="#1B2A33" stroke-width="1"/>
  <text x="48" y="585" font-family="Courier,monospace" font-size="11" letter-spacing="2" fill="#8E97A8">CBB · WEEKLY INTELLIGENCE · EVERY THURSDAY 06:00 UTC</text>
</svg>
