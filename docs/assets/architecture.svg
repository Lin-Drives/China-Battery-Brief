<svg width="1160" height="580" viewBox="0 0 1160 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram: Cloudflare CDN, Nginx reverse proxy, single Node process with Hono and tRPC, Drizzle ORM and MySQL">
  <defs>
    <pattern id="aDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.1" fill="#1B2A33"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8E97A8"/>
    </marker>
  </defs>

  <rect width="1160" height="580" fill="#0C1017"/>
  <rect width="1160" height="580" fill="url(#aDots)"/>

  <text x="64" y="36" font-family="Courier, monospace" font-size="12" letter-spacing="3" fill="#8E97A8">ARCHITECTURE</text>
  <line x1="64" y1="46" x2="1096" y2="46" stroke="#1B2A33" stroke-width="1"/>

  <!-- Client -->
  <rect x="60" y="62" width="1040" height="64" fill="#0C1017" stroke="#1B2A33" stroke-width="1.5"/>
  <text x="84" y="84" font-family="Courier, monospace" font-size="11" letter-spacing="2.5" fill="#8E97A8">CLIENT · BROWSER</text>
  <text x="84" y="112" font-family="Georgia, serif" font-size="20" fill="#F4F0E6">React 19 SPA — TypeScript · Vite 7 · Tailwind CSS · GSAP + R3F</text>

  <!-- Edge -->
  <rect x="60" y="176" width="260" height="92" fill="#0C1017" stroke="#5ADFC3" stroke-width="1.5"/>
  <text x="84" y="204" font-family="Courier, monospace" font-size="14" letter-spacing="2" fill="#5ADFC3">CLOUDFLARE CDN</text>
  <text x="84" y="230" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">DNS · TLS · WAF · cache</text>
  <text x="84" y="250" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">Proxied (orange cloud)</text>

  <rect x="360" y="176" width="340" height="92" fill="#0C1017" stroke="#F0A832" stroke-width="1.5"/>
  <text x="384" y="204" font-family="Courier, monospace" font-size="14" letter-spacing="2" fill="#F0A832">NGINX REVERSE PROXY</text>
  <text x="384" y="230" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">TLS/HSTS · real-IP (XFF) trust</text>
  <text x="384" y="250" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">Static edge for dist/public</text>

  <!-- App process -->
  <rect x="60" y="318" width="1040" height="132" fill="#0C1017" stroke="#5ADFC3" stroke-width="1.5"/>
  <text x="84" y="348" font-family="Courier, monospace" font-size="14" letter-spacing="2" fill="#5ADFC3">NODE — HONO + TRPC · SINGLE PROCESS</text>
  <rect x="880" y="334" width="196" height="34" fill="#1B2A33" stroke="#5ADFC3" stroke-width="1"/>
  <text x="978" y="356" text-anchor="middle" font-family="Courier, monospace" font-size="11" letter-spacing="2" fill="#5ADFC3">SYSTEMD · CBB.SERVICE</text>
  <text x="84" y="376" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">HONO SERVES dist/public (SPA) + /api/trpc · SUPERJSON</text>

  <g font-family="Courier, monospace" font-size="11" letter-spacing="1.5">
    <rect x="84" y="392" width="72" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="120" y="410" text-anchor="middle" fill="#F4F0E6">auth</text>
    <rect x="168" y="392" width="84" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="210" y="410" text-anchor="middle" fill="#F4F0E6">content</text>
    <rect x="264" y="392" width="80" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="304" y="410" text-anchor="middle" fill="#F4F0E6">billing</text>
    <rect x="356" y="392" width="60" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="386" y="410" text-anchor="middle" fill="#F4F0E6">me</text>
    <rect x="428" y="392" width="84" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="470" y="410" text-anchor="middle" fill="#F4F0E6">admin</text>
    <rect x="524" y="392" width="68" height="26" fill="#1B2A33" stroke="#1B2A33" stroke-width="1"/>
    <text x="558" y="410" text-anchor="middle" fill="#F4F0E6">ping</text>
  </g>
  <text x="84" y="440" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">GATING: publicQuery · authedQuery · adminQuery · PAYWALL = SERVER-SIDE TRUNCATION</text>

  <!-- Data -->
  <rect x="60" y="500" width="300" height="64" fill="#0C1017" stroke="#C9F24B" stroke-width="1.5"/>
  <text x="84" y="528" font-family="Courier, monospace" font-size="14" letter-spacing="2" fill="#C9F24B">DRIZZLE ORM</text>
  <text x="84" y="550" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">mysql2 · planetscale mode</text>

  <rect x="400" y="500" width="340" height="64" fill="#0C1017" stroke="#C9F24B" stroke-width="1.5"/>
  <text x="424" y="528" font-family="Courier, monospace" font-size="14" letter-spacing="2" fill="#C9F24B">MYSQL · MARIADB ON-BOX</text>
  <text x="424" y="550" font-family="Courier, monospace" font-size="11.5" letter-spacing="1.5" fill="#8E97A8">12 tables · idempotent seed</text>

  <!-- Arrows -->
  <g stroke="#8E97A8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M580 126 L580 176"/>
    <path d="M320 222 L360 222"/>
    <path d="M530 268 L530 318"/>
    <path d="M580 450 L580 500"/>
    <path d="M360 532 L400 532"/>
  </g>

  <g font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#8E97A8">
    <text x="590" y="152">HTTPS / HSTS</text>
    <text x="588" y="478">superjson</text>
    <text x="366" y="548" text-anchor="start">SQL</text>
  </g>
</svg>
